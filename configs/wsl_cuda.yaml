asr:
  provider: sensevoice
  model: models/SenseVoiceSmall
  language: auto
  use_itn: false
  device: cuda:0

llm:
  provider: qwen35_transformers
  model: models/Qwen3.5-4B
  max_new_tokens: 128
  load_in_4bit: true
  compute_dtype: float16
  enable_thinking: false
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  system_prompt: 你是一个友好的中文语音助手
  reply_instruction: 回答简短一些，保持在50字以内。

tts:
  provider: kokoro
  model: models/Kokoro-82M
  language_code: z
  default_voice: zf_xiaoxiao
  speed: 1.0
  sample_rate: 24000
  output_format: wav
  device: cuda

audio:
  playback_backend: paplay
  sample_rate: 16000
  frame_duration_ms: 20
  vad_mode: 3
  start_trigger_ms: 200
  end_silence_ms: 800
  pre_roll_ms: 200
  speech_timeout_seconds: 30.0
  max_utterance_seconds: 30.0

runtime:
  output_dir: output/wsl

observability:
  enabled: true
  console: true
  jsonl: true
  log_dir: logs/wsl
