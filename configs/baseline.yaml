asr:
  provider: qwen3_asr_transformers
  model: Qwen/Qwen3-ASR-0.6B-hf
  language: auto
  compute_dtype: bfloat16
  attention_implementation: sdpa
  max_new_tokens: 256
  prompt: ""

llm:
  provider: qwen35_transformers
  model: Qwen/Qwen3.5-4B
  max_new_tokens: 128
  load_in_4bit: true
  compute_dtype: float16
  enable_thinking: false
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  system_prompt: 你是一个友好的中文语音助手
  reply_instruction: 回答简短一些，保持在50字以内。

tts:
  provider: qwen3_tts_worker
  model: Qwen/Qwen3-TTS-12Hz-0.6B-Base
  language_code: Chinese
  default_voice: reference
  sample_rate: 24000
  output_format: wav
  device: cuda:0
  worker_python: .venv-tts/bin/python
  worker_script: scripts/qwen3_tts_worker.py
  reference_audio: voices/reference.wav
  reference_text: >-
    Okay. Yeah. I resent you. I love you. I respect you. But you know what?
    You blew it! And thanks to you.
  x_vector_only_mode: false
  dtype: bfloat16
  attention_implementation: sdpa
  max_new_tokens: 256
  startup_timeout_seconds: 180

audio:
  sample_rate: 16000
  frame_duration_ms: 20
  vad_mode: 2
  start_trigger_ms: 60
  end_silence_ms: 800
  pre_roll_ms: 200
  speech_timeout_seconds: 30.0
  max_utterance_seconds: 30.0

runtime:
  output_dir: output

observability:
  enabled: true
  console: true
  jsonl: true
  log_dir: logs
