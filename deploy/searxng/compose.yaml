name: asr-llm-tts-search

services:
  searxng:
    container_name: asr-llm-tts-searxng
    image: ghcr.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Run scripts/manage_searxng.sh up first}"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    stop_grace_period: 10s

volumes:
  searxng-cache:
